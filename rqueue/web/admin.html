<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rqueue admin</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
<header>
    <h1>rqueue</h1>
</header>

<section class="summary">
    <div class="stat processed">
        <span class="value">__TOTAL_PROCESSED__</span>
        <span class="label">processed</span>
    </div>
    <div class="stat failed">
        <span class="value">__TOTAL_FAILED__</span>
        <span class="label">failed</span>
    </div>
</section>

<table class="queues">
    <thead>
        <tr>
            <th>Queue</th>
            <th>Pending</th>
        </tr>
    </thead>
    <tbody>
        __QUEUE_ROWS__
    </tbody>
</table>

<script src="/admin/assets/admin.js"></script>
</body>
</html>
